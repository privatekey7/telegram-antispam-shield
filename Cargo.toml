[package]
name = "telegram-antispam-shield"
version = "0.3.0"
edition = "2021"
rust-version = "1.88"
description = "Lightweight Telegram anti-spam bot (RU/EN) with a small embedded ML model."
license = "MIT"
repository = "https://github.com/privatekey7/telegram-antispam-shield"
readme = "README.md"

[[bin]]
name = "telegram-antispam-shield"
path = "src/main.rs"

[lib]
name = "telegram_antispam_shield"
path = "src/lib.rs"

[dependencies]
teloxide = { version = "0.17", default-features = false, features = ["ctrlc_handler", "rustls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
dotenvy = "0.15"
# Already pulled in by teloxide: HTTP for CAS lookups and JSON decoding.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
# Already pulled in by teloxide; needed for mute end times (`until_date`).
chrono = { version = "0.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
# Already pulled in by teloxide; the poller reads raw updates (src/bot/polling.rs).
futures = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1.0.154"

[profile.release]
# Keep the release build lightweight and reliable on small CI/PaaS builders
# (aggressive LTO + single codegen unit can run out of memory there).
strip = true

